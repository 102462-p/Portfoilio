<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200">
  <!-- Outer window frame with thin blue border -->
  <rect x="8" y="8" width="224" height="184" rx="6" ry="6" fill="#C0C0C0" stroke="#0A246A" stroke-width="4"/>

  <!-- Rounded title bar with gradient and bright top -->
  <defs>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E5FFF"/> <!-- bright top -->
      <stop offset="70%" stop-color="#0A246A"/> <!-- main title bar color -->
      <stop offset="100%" stop-color="#1C4F9C"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="224" height="32" rx="6" ry="6" fill="url(#titleGradient)"/>

  <!-- XP-style window buttons on the right, vertically centered in title bar -->
  <rect x="192" y="14" width="12" height="12" rx="2" ry="2" fill="#FF5C5C" stroke="#800000" stroke-width="1"/> <!-- red -->
  <rect x="176" y="14" width="12" height="12" rx="2" ry="2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/> <!-- yellow->white -->
  <rect x="160" y="14" width="12" height="12" rx="2" ry="2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/> <!-- green->white -->

  <!-- Console background with subtle 3D border -->
  <rect x="12" y="40" width="216" height="152" fill="#000000" stroke="#0A246A" stroke-width="4"/>
  <rect x="12" y="40" width="216" height="2" fill="#404080"/> <!-- top shading -->
  <rect x="12" y="190" width="216" height="2" fill="#404080"/> <!-- bottom shading -->

  <!-- Bold C:\_ text -->
  <text x="24" y="100"
        font-family="Consolas, Courier New, monospace"
        font-size="40"
        font-weight="bold"
        fill="#C0C0C0">
    C:\_
  </text>
</svg>
