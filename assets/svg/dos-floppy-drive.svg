  <rect class="pixel" x="24" y="10" width="2" height="2" fill="#000000"/>
  
  <!-- Metal shutter area - top -->
  <rect class="pixel" x="6" y="12" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="8" y="12" width="2" height="2" fill="#000000"/>
  <rect class="pixel" x="10" y="12" width="2" height="2" fill="#000000"/>
