  <rect class="pixel" x="18" y="8" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="20" y="8" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="22" y="8" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="24" y="8" width="2" height="2" fill="#000000"/>
  
  <!-- Second row -->
