  <rect class="pixel" x="20" y="18" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="22" y="18" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="24" y="18" width="2" height="2" fill="#000000"/>
  
