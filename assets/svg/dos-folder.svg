<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Define the pixelated style -->
  <style>
    .pixel { shape-rendering: crispEdges; }
  </style>
  
  <!-- Background (transparent) -->
  
  <!-- Folder tab - dark -->
  <rect class="pixel" x="4" y="8" width="2" height="2" fill="#000000"/>
  <rect class="pixel" x="6" y="8" width="2" height="2" fill="#000000"/>
  <rect class="pixel" x="8" y="8" width="2" height="2" fill="#000000"/>
  <rect class="pixel" x="10" y="8" width="2" height="2" fill="#000000"/>
  <rect class="pixel" x="12" y="8" width="2" height="2" fill="#000000"/>
  
  <!-- Folder tab highlight -->
  <rect class="pixel" x="4" y="10" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="6" y="10" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="8" y="10" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="10" y="10" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="12" y="10" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="14" y="10" width="2" height="2" fill="#FFFFFF"/>
  
  <!-- Main folder body - top edge -->
  <rect class="pixel" x="4" y="12" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="6" y="12" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="8" y="12" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="10" y="12" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="12" y="12" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="14" y="12" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="16" y="12" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="18" y="12" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="20" y="12" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="22" y="12" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="24" y="12" width="2" height="2" fill="#FFFFFF"/>
  
  <!-- Middle rows of folder -->
  <rect class="pixel" x="4" y="14" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="6" y="14" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="8" y="14" width="2" height="2" fill="#FFFFFF"/>
