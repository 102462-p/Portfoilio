  <rect class="pixel" x="22" y="16" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="24" y="16" width="2" height="2" fill="#000000"/>
  
  <rect class="pixel" x="4" y="18" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="6" y="18" width="2" height="2" fill="#FFFFFF"/>
  <rect class="pixel" x="8" y="18" width="2" height="2" fill="#FFFFFF"/>
