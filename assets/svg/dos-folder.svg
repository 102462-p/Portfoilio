  <rect class="pixel" x="24" y="18" width="2" height="2" fill="#000000"/>
  
  <!-- Bottom row -->
  <rect class="pixel" x="4" y="20" width="2" height="2" fill="#000000"/>
  <rect class="pixel" x="6" y="20" width="2" height="2" fill="#000000"/>
  <rect class="pixel" x="8" y="20" width="2" height="2" fill="#000000"/>
  <rect class="pixel" x="10" y="20" width="2" height="2" fill="#000000"/>
  <rect class="pixel" x="12" y="20" width="2" height="2" fill="#000000"/>
